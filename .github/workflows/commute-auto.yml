name: Home Tracker - Automatic Morning Commute Route Checks

on:
  schedule:
    # Daily at 09:35 Asia/Taipei (UTC+08:00)
    - cron: "35 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-route-auto-worker
  cancel-in-progress: false

jobs:
  check-morning-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HOME_ROUTE_WORKER_TOKEN: ${{ secrets.HOME_ROUTE_WORKER_TOKEN }}
    steps:
      - name: Confirm the worker secret is configured
        if: env.HOME_ROUTE_WORKER_TOKEN == ''
        run: |
          echo "Automatic route worker not activated: HOME_ROUTE_WORKER_TOKEN is missing."
          echo "No paid Google API calls will be made."

      - name: Process eligible properties (strict quota)
        if: env.HOME_ROUTE_WORKER_TOKEN != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-route-worker-token: ${HOME_ROUTE_WORKER_TOKEN}" \
            "https://uwvtcqdsmuldswqbxtjf.supabase.co/functions/v1/home-route-auto-worker"
          echo
